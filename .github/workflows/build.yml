name: build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: write  # needed to create/upload Release assets

jobs:
  stm32cubeide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build STM32CubeIDE project
        uses: xanderhendriks/action-build-stm32cubeide@v16.1
        with:
          project-path: .
          project-target: "seri/Release"

      # Optional but highly recommended: find the output so you know the right path
      - name: Locate build outputs
        run: |
          echo "HEX files:"
          find . -type f -name "*.hex" -print
          echo "ELF files:"
          find . -type f -name "*.elf" -print

      # Only runs for tag pushes (v*)
      - name: Create GitHub Release and upload .hex
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.hex
            **/*.elf
